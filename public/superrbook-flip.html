<title>SuperrBook — vector flip</title>
<style>
  body{margin:0;background:transparent;display:flex;min-height:100vh;align-items:center;justify-content:center;}
  .sb-scene{ width:100%; max-width:1050px; aspect-ratio:1000/700; perspective:2200px; perspective-origin:52% 42%; }
  .sb-book{ position:relative; width:100%; height:100%; transform-style:preserve-3d; }
  .sb-base{ position:absolute; inset:0; }
  .sb-flap{ position:absolute; left:50%; top:8.571%; width:43%; height:82.857%;
     transform-origin:left center; transform-style:preserve-3d; will-change:transform; z-index:5; }
  .sb-face{ position:absolute; inset:0; backface-visibility:hidden; }
  .sb-back{ transform:rotateY(180deg); }

  .sb-replay{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
     font:500 13px/1 system-ui,sans-serif; padding:8px 16px; border-radius:999px;
     border:1px solid #d9cdbb; background:#fff; color:#6b4c2e; cursor:pointer; }
  @media (prefers-reduced-motion: reduce){ .sb-flap{ transform:rotateY(-180deg)!important; } }
</style>

<script>
(function(){
  var flap=document.getElementById('flap'), book=document.getElementById('book');

  function easeInOut(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  var A=[];
  for(var i=0;i<13;i++) A.push(0);                         // closed hold
  for(var k=1;k<=30;k++)A.push(-180*easeInOut(k/30));       // opening
  for(var i=0;i<27;i++) A.push(-180);                      // open hold
  for(var k=1;k<=30;k++)A.push(-180*(1-easeInOut(k/30)));   // closing
  // A.length === 100

  function apply(a){
    flap.style.transform='rotateY('+a+'deg)';
    var t=Math.min(1,-a/180), s=Math.sin(t*Math.PI);
    book.style.transform='rotateY('+(-4*s).toFixed(2)+'deg)';
  }

  var f=0, timer=null;
  function tick(){ apply(A[f]); f=(f+1)%A.length; }
  function start(){ if(timer) return; timer=setInterval(tick, 30); }   // 100 frames, loops
  apply(A[0]); start();
  document.getElementById('replay').addEventListener('click',function(){ f=0; });
})();
</script>
